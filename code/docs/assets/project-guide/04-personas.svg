<text x="1144" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">详情、话题、来源与身份披露</text>
<text x="1144" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">目录请求不再依赖聊天状态成功</text>

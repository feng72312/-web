<text x="614" y="588" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">bootstrap = 模式约束 + 人物资料</text>
<text x="614" y="622" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">metadata 绑定 personaId 与模式</text>
<text x="614" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">81 个历史模拟 / 84 个公开框架</text>

<text x="84" y="273" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">awesome-nuwa 分类与人物列表</text>
<text x="84" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#292D32">固定聚合仓库提交，记录人物提交</text>

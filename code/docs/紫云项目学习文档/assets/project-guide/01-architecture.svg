<polygon points="800,660 805.654551943446,671.7058123305848 794.345448056554,671.7058123305848" fill="#626873"/>
<text x="60" y="893" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#626873">箭头表示主要调用或数据供给方向；API 响应和流式文本沿调用链返回。</text>
